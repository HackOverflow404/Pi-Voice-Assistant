server:
  host: 0.0.0.0
  port: 8765
  token: REPLACE_WITH_RANDOM_TOKEN_AT_LEAST_32_CHARACTERS
  # Optional TLS. Both paths must be set together; Android must trust the CA.
  tls_cert: null
  tls_key: null
models:
  wake: models/custom.onnx
  whisper: models/whisper-tiny.en
  piper: models/en_US-lessac-medium.onnx
audio:
  wake_threshold: 0.5
  speech_rms: 450
  silence_seconds: 1.0
  start_timeout_seconds: 5.0
  max_utterance_seconds: 20.0
  # Start of each recording ignored for speech detection, covering the listening chime (0.45 s,
  # heard by the mic until ~0.8 s after listening starts). Still transcribed.
  listen_grace_seconds: 1.0
  # A wake word only counts if the phrase is this many times louder than the room before it.
  # Real wakes have measured 3.3-43x depending on distance and mic level; false triggers from
  # silence or TV 1.5-4x. Low values rely on the later filters (noise transcripts, the send
  # countdown, Jev's accidental route) to catch the rest.
  wake_min_ratio: 3
  # The same while a request is in progress or a reply is playing: the wake word interrupts
  # it, and the Echo's own voice is the background it must stand out from.
  barge_in_min_ratio: 1.5
  # A wake word scoring at least this but under wake_threshold is logged as a near miss.
  wake_near_miss: 0.2
  # Keep the last five raw recordings in state/utterances, and the audio around the last 200
  # wake decisions (accepted, ignored, near misses) in state/wake, for tuning. Off by default.
  debug_save_utterances: false
# Where spoken requests go: sms (a Google Voice number, through its Gmail account) or
# whatsapp (the wa-bridge). Only the chosen section is used.
messenger: sms
sms:
  # The assistant's phone number. Every text it sends is read aloud: replies to requests
  # and messages it sends on its own.
  contact: "+15555550123"
  # The Gmail account that owns the Google Voice number, and an app password for it
  # (myaccount.google.com/apppasswords; needs 2-Step Verification). Keep this file private.
  gmail_address: you@gmail.com
  app_password: REPLACE_WITH_GMAIL_APP_PASSWORD
  # Found automatically in the inbox once the contact has texted the Voice number;
  # set it to skip the search (the From address of a forwarded text).
  reply_address: ""
  # Gmail folder the forwarded texts land in, and how often to check it.
  mailbox: INBOX
  poll_seconds: 3
  reply_timeout_seconds: 180
  reply_settle_seconds: 3
  max_reply_chars: 4000
  send_delay_seconds: 3
  # Texts that arrive while the Echo is offline are read on reconnect unless older than this.
  stale_minutes: 60
  instruction: '(Spoken request; your reply will be read aloud. Answer in plain, complete sentences with every word written out: no abbreviations, symbols, emoji, lists or formatting. Put your whole answer in one message.)'
whatsapp:
  # Local bridge (bridge/, systemd unit wa-bridge) that is linked to your WhatsApp account.
  bridge_url: http://127.0.0.1:8766
  # Chat to text: a contact or business name as it appears in WhatsApp, or a phone
  # number with country code (digits only).
  contact: Instinct
  reply_timeout_seconds: 180
  # Replies split across several messages are joined if each follows within this time.
  reply_settle_seconds: 3
  max_reply_chars: 4000
  # Seconds the Echo shows "Sending in N, tap to cancel" before the request is sent.
  send_delay_seconds: 3
  # Said as soon as the contact reacts to a request with these emoji; the reply follows.
  reaction_phrases:
    "👀": "Looking into it."
    "👍": "On it."
  # Appended to every spoken request. Empty to send the words only. Voice-note replies are played
  # on the Echo as they are; text replies are read aloud.
  instruction: Respond using an audio message
  # For this long after each request, every voice note the contact sends is played (0: replies only).
  voice_window_seconds: 600
  # false: only voice notes are played. Text messages are never read aloud, and don't count as the
  # answer (the contact may send an unrelated update first); a text-only answer is shown on the
  # Echo once reply_timeout_seconds runs out.
  speak_text: true
tts:
  # piper: local voice (models.piper). deepgram: Aura-2 cloud voices, far more natural and
  # no load on the Pi, but reply text is sent to Deepgram. Piper remains the fallback.
  engine: piper
  deepgram_api_key: ""
  # e.g. aura-2-thalia-en, aura-2-andromeda-en, aura-2-helena-en, aura-2-apollo-en, aura-2-orion-en
  deepgram_voice: aura-2-thalia-en
  # Speaking rate for Deepgram voices, 0.7-1.5 (1.2 is about 20% faster).
  deepgram_speed: 1.0
  # The Echo keeps media volume at maximum for Bluetooth speakers; speech plays at this
  # fraction of it (0.01-1).
  speech_volume: 0.3
stt:
  # whisper: local (models.whisper, ~5 s per request on a Pi 4). deepgram: Nova-3 in the
  # cloud using tts.deepgram_api_key, under a second; the recorded request (only the audio
  # after the wake word) is sent to Deepgram. Whisper is then not loaded at all (it
  # saves ~130 MB); if Deepgram fails, the request is reported, not transcribed locally.
  engine: whisper
  deepgram_model: nova-3
  # Names and jargon you say that get misheard: people, places, course codes, shows. Nova-3
  # favours these spellings (keyterm prompting, up to 100); Whisper gets them as hotwords.
  # Keep it to words that actually go wrong: every term nudges similar-sounding speech toward it.
  keyterms: [Clippy, Instinct, Luxo Jr.]
echo:
  # adb serial of the Echo attached to the Pi by USB; null uses the only attached device.
  adb_serial: null
  # "Start pairing" keeps the Echo discoverable this long, then returns to the dashboard.
  pairing_seconds: 120
mqtt:
  # Optional. Publishes Clippy to Home Assistant over MQTT discovery (status, last request
  # and reply, Echo connection, voice and speaker volume, pairing buttons). Empty: off.
  host: ""
  port: 1883
  # The broker's login for Clippy (Mainframe's broker refuses anonymous clients).
  username: ""
  password: ""
lamp:
  # Luxo Jr., the RF floor lamp, pressed through its remote wired to this Pi (the rf-lamp project).
  # Run with the system Python, which has pigpio. Empty: lamp commands say it isn't set up.
  command: []
  # command: [/usr/bin/python3, /home/user/rf-lamp/send.py]
phone:
  # "Find my phone": rings the phone with a Home Assistant critical alert through the
  # Companion app (it sounds on silent and in a Focus), then says where HA last saw it.
  # token is a long-lived access token (HA profile > Security). Empty: not set up.
  token: ""
  ha_url: http://127.0.0.1:8123
  notify: mobile_app_lc_3          # the notify service, without "notify."
  tracker: device_tracker.lc_3
mtd:
  # Champaign-Urbana bus times from MTD's API v3 (https://mtd.dev; create an account there
  # for a key). "When's the next bus" checks default_route at default_stop unless you name
  # others; "which bus should I take to Target" plans direct trips from default_stop or any
  # stop within nearby_meters of it. Empty api_key: not set up.
  api_key: ""
  default_stop: Campus Circle      # a stop name as MTD writes it, or a stop ID like IU
  default_route: "22"              # a route number or name; 22 covers the Illini and Illini Limited, 22 and 220
  nearby_meters: 400               # starting stops a short walk from default_stop
  destination_meters: 400          # stops this close to the destination count as getting there
  max_options: 2                   # trips offered for "which bus should I take"
jev:
  # Optional. TypeSafe's Jev routes what the grammar doesn't recognize: a request for
  # Instinct, a device command, a cancellation, or an accidental trigger. The transcript
  # is sent to TypeSafe. Empty: only the built-in phrases control the Echo.
  api_key: ""
  # Below this probability Jev's answer is not trusted and the request goes to Instinct.
  min_probability: 0.6
  timeout_seconds: 3
  # What Instinct can do, so Jev routes those requests to it. Empty: the built-in description
  # (controls.INSTINCT): schedule, coursework, to-do list, job applications, email, texts, notes,
  # groceries, and anything that needs knowledge or a web search.
  instinct: ""
calendar:
  # Private iCal addresses shown on the dashboard. Google Calendar: Settings -> your
  # calendar -> Integrate calendar -> "Secret address in iCal format". Anyone with the
  # link can read the calendar, so keep this file private. Empty: the Echo uses its own
  # synced calendars instead (which needs Google Play services on the Echo).
  ical_urls: []
  refresh_minutes: 5
state_dir: state
