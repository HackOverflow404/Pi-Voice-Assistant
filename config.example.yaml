server:
  host: 0.0.0.0
  port: 8765
  token: REPLACE_WITH_RANDOM_TOKEN_AT_LEAST_32_CHARACTERS
  # Optional TLS. Both paths must be set together; Android must trust the CA.
  tls_cert: null
  tls_key: null
models:
  wake: models/custom.onnx
  vosk: models/vosk-model-small-en-us-0.15
  piper: models/en_US-lessac-medium.onnx
audio:
  wake_threshold: 0.5
  speech_rms: 450
  silence_seconds: 1.0
  start_timeout_seconds: 5.0
  max_utterance_seconds: 20.0
  # Keep the last five raw recordings in state/utterances for tuning. Off by default.
  debug_save_utterances: false
whatsapp:
  # Local bridge (bridge/, systemd unit wa-bridge) that is linked to your WhatsApp account.
  bridge_url: http://127.0.0.1:8766
  # Chat to text: a contact or business name as it appears in WhatsApp, or a phone
  # number with country code (digits only).
  contact: Instinct
  reply_timeout_seconds: 180
  # Replies split across several messages are joined if each follows within this time.
  reply_settle_seconds: 3
  max_reply_chars: 4000
calendar:
  # Private iCal addresses shown on the dashboard. Google Calendar: Settings -> your
  # calendar -> Integrate calendar -> "Secret address in iCal format". Anyone with the
  # link can read the calendar, so keep this file private. Empty: the Echo uses its own
  # synced calendars instead (which needs Google Play services on the Echo).
  ical_urls: []
  refresh_minutes: 5
state_dir: state
