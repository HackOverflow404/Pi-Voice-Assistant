// shairport-sync for airplay-relay: audio goes to stdout (44.1 kHz, stereo, s16le), which
// relay.py streams to the Echo. Advertised under the Pi's hostname, like the stock service.
general =
{
	name = "%H";
	interpolation = "soxr";
	output_backend = "stdout";
	// The Echo plays about 0.3 s after shairport-sync writes (relay, USB, its audio buffers).
	// Writing that much early keeps AirPlay video in sync with the sound.
	audio_backend_latency_offset_in_seconds = -0.3;
};
metadata =
{
	enabled = "no";
};
diagnostics =
{
	log_verbosity = 0;
};
